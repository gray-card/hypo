included:
  - App
  - Extensions
  - Packages

excluded:
  - Packages/*/.build
  - Packages/*/.swiftpm
  - App/HypoOAuthConfiguration.generated.swift
  - Packages/HypoLexicon/Sources/HypoLexicon/Generated

# swift-format owns layout and is run immediately before SwiftLint. Keep this list
# to correctness and redundancy checks that do not contradict that formatter.
only_rules:
  - block_based_kvo
  - class_delegate_protocol
  - compiler_protocol_init
  - computed_accessors_order
  - deployment_target
  - discouraged_direct_init
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_xctest_method
  - implicit_getter
  - invalid_swiftlint_command
  - is_disjoint
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - no_fallthrough_only
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - orphaned_doc_comment
  - private_over_fileprivate
  - private_unit_test
  - protocol_property_accessors_order
  - reduce_boolean
  - redundant_discardable_let
  - redundant_objc_attribute
  - implicit_optional_initialization
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - self_in_property_initialization
  - superfluous_disable_command
  - trailing_semicolon
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable
  - void_function_in_ternary
  - weak_delegate
  - xctfail_message
  - yoda_condition

reporter: xcode
