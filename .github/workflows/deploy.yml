name: Release Hypo

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - id: release
        name: Verify the tag, package version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning (for example, v1.0.0)." >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION." >&2
            exit 1
          fi

          RELEASE_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Tagged commit $RELEASE_COMMIT is not contained in origin/main." >&2
            exit 1
          fi

          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  gates:
    name: Run release gates
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      package_pages: true

  deploy:
    name: Deploy GitHub Pages
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create or repair the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Hypo $RELEASE_VERSION"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Hypo $RELEASE_VERSION"
          fi

          echo "### Hypo $RELEASE_VERSION released" >> "$GITHUB_STEP_SUMMARY"
          echo "The tagged main commit passed all release gates, was deployed to GitHub Pages, and has a GitHub Release." >> "$GITHUB_STEP_SUMMARY"
